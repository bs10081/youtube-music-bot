# Folia web：SPA 靜態頁 + 反代 bot 的 Folia bridge（9863）
# conf.d/*.conf 會被 include 進 http 區塊，map 放頂層合法
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Folia bridge WebSocket（長連線）
    location = /api/ws/lyric {
        proxy_pass http://youtube-music-bot:9863;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # nowPlayingClock RTT 漂移校正（7 秒輪詢，best-effort）
    location = /api/query/progress {
        proxy_pass http://youtube-music-bot:9863;
        proxy_set_header Host $host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
